global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    cluster: observability-lab

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.json
        refresh_interval: 10s
